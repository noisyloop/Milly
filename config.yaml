# ============================================================================
# Milly configuration
#
# Every option below has a built-in default — if this file is missing or a key
# is omitted, Milly falls back to the defaults shown here. Edit and restart.
# ============================================================================

# --- Core ---
provider: ollama                       # Which entry under `providers:` to use at startup
default_model: llama3.2                # Model name for that provider (`/models` lists them)
temperature: 0.7                       # Sampling temperature; ignored by providers that don't support it
show_thinking: false                   # Show reasoning from thinking models (qwen3, deepseek-r1,
                                       # gpt-oss, ...). Toggle live with /think. Never saved to history.

# --- Model providers ---
# Switch live with `/provider NAME` or `/model PROVIDER:MODEL`, or at launch with
#   python main.py --model anthropic:claude-opus-5-5
#
# Only `ollama` keeps everything on this machine. Cloud providers send your
# prompts (and any retrieved doc snippets) to that service. Guardian still
# checks both input and output either way.
#
# API keys are read from environment variables — never put keys in this file.
providers:
  ollama:
    type: ollama
    host: http://localhost:11434       # Ollama API endpoint (local — no egress)
    # num_ctx: 8192                    # Optional: larger context window for long chats/RAG

  openai:                              # Any OpenAI-compatible API (pip install openai)
    type: openai
    api_key_env: OPENAI_API_KEY
    # base_url: https://openrouter.ai/api/v1   # e.g. OpenRouter, Groq, Together...
    # default_model: gpt-5

  anthropic:                           # Claude models (pip install anthropic)
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-opus-5-5
    max_tokens: 64000
    # effort: medium                   # low | medium | high | xhigh | max (newer Claude models)

  # Local OpenAI-compatible servers — mark `local: true` so Milly doesn't
  # show the cloud warning. Uncomment the ones you run:
  # lmstudio:
  #   type: openai
  #   base_url: http://localhost:1234/v1
  #   local: true
  # llamacpp:
  #   type: openai
  #   base_url: http://localhost:8080/v1
  #   local: true

# --- Guardian (security layer) ---
guardian_enabled: true                 # Master switch for input/output security checks
guardian_sensitivity: medium           # Detection aggressiveness: low | medium | high
                                       #   low    — only the most obvious attacks (instruction
                                       #            substitution, authority impersonation)
                                       #   medium — default; balanced OWASP LLM pattern set
                                       #   high   — flags merely suspicious phrasing too
                                       #            (hypothetical framing, encoded payloads)
max_input_length: 4000                 # Reject inputs longer than this many characters

# --- Audit ---
audit_logging: true                    # Write security events to logs/security.log

# --- System prompt ---
# Milly's persona/instructions load from system_prompt.txt (project root).
# Edit that file to customise behaviour. The key below is a fallback only,
# used when system_prompt.txt is absent.
# system_prompt: "You are Milly, a helpful local AI assistant."

# --- Memory (advanced) ---
memory:
  enabled: true
  max_history: 50                      # Max user+assistant turn pairs kept per session

# --- RAG (advanced) ---
rag:
  enabled: true
  max_file_size_mb: 10                 # Skip docs larger than this during /ingest
  scan_for_injection: true             # Run Guardian over ingested documents
  top_k: 3                             # Number of doc chunks retrieved per query
